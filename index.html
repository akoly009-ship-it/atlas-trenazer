<title>Atlas Trenažér</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#eae6d8;
    --paper-raised:#f4f1e6;
    --ink:#1c2b2e;
    --ink-soft:#4a5c5c;
    --line:#c9c1a8;
    --brass:#a8672c;
    --brass-deep:#7d4a1c;
    --ok:#3f7d54;
    --ok-fill:#bfe0c8;
    --bad:#a8402f;
    --bad-fill:#eec3ba;
    --map-fill:#f7f4ea;
    --map-fill-dim:#eeeadb;
    --map-stroke:#8a8264;
    --map-hover:#f1e2b8;
    --panel-shadow:0 10px 30px -12px rgba(28,43,46,.35);
    --focus:#3f7d54;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101b1c;
      --paper-raised:#162424;
      --ink:#e9e6d8;
      --ink-soft:#9fb0ac;
      --line:#2c3b3a;
      --brass:#d99a52;
      --brass-deep:#e9b46f;
      --ok:#6fbf8a;
      --ok-fill:#1f3a2a;
      --bad:#e08b78;
      --bad-fill:#3c2420;
      --map-fill:#1a2a2a;
      --map-fill-dim:#152121;
      --map-stroke:#4a5c58;
      --map-hover:#334a3c;
      --panel-shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101b1c;
    --paper-raised:#162424;
    --ink:#e9e6d8;
    --ink-soft:#9fb0ac;
    --line:#2c3b3a;
    --brass:#d99a52;
    --brass-deep:#e9b46f;
    --ok:#6fbf8a;
    --ok-fill:#1f3a2a;
    --bad:#e08b78;
    --bad-fill:#3c2420;
    --map-fill:#1a2a2a;
    --map-fill-dim:#152121;
    --map-stroke:#4a5c58;
    --map-hover:#334a3c;
    --panel-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Work Sans",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:100%;
  }

  header.top{
    flex:0 0 auto;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand h1{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0;
    letter-spacing:.01em;
  }
  .brand h1 em{
    font-style:normal;
    color:var(--brass-deep);
  }
  .score{
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }

  nav.modes{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  nav.modes button{
    font:inherit;
    font-family:"Work Sans",sans-serif;
    font-size:.74rem;
    font-weight:600;
    letter-spacing:.02em;
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  nav.modes button:hover{border-color:var(--brass);}
  nav.modes button.active{
    background:var(--brass);
    border-color:var(--brass);
    color:#fff8ee;
  }
  nav.modes button:focus-visible, .ctrl-btn:focus-visible, .zoom-btn:focus-visible, input:focus-visible, .toggle:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .prompt-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .prompt{
    font-family:"Fraunces",serif;
    font-size:clamp(1rem,3vw,1.3rem);
    font-weight:600;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .prompt .target{color:var(--brass-deep);}
  .subprompt{
    font-size:.78rem;
    color:var(--ink-soft);
  }
  .progress{
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    margin-left:auto;
    white-space:nowrap;
  }

  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.72rem;
    color:var(--ink-soft);
  }
  .toggle{
    position:relative;
    width:34px;
    height:19px;
    border-radius:999px;
    background:var(--line);
    border:none;
    cursor:pointer;
    flex:0 0 auto;
  }
  .toggle::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:15px;height:15px;
    border-radius:50%;
    background:var(--paper-raised);
    transition:transform .15s;
  }
  .toggle.on{background:var(--brass);}
  .toggle.on::after{transform:translateX(15px);}

  main.stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    background:var(--map-fill-dim);
    overflow:hidden;
  }
  svg.map{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:grab;
  }
  svg.map:active{cursor:grabbing;}
  path.land{
    fill:var(--map-fill);
    stroke:var(--map-stroke);
    stroke-width:.5;
    vector-effect:non-scaling-stroke;
    transition:fill .12s;
  }
  path.land:hover{ fill:var(--map-hover); }
  path.land.correct{ fill:var(--ok-fill); stroke:var(--ok); }
  path.land.wrong{ fill:var(--bad-fill); stroke:var(--bad); }
  path.land.revealed{ fill:var(--brass); stroke:var(--brass-deep); }
  path.state{
    fill:var(--map-fill);
    stroke:var(--map-stroke);
    stroke-width:.6;
    vector-effect:non-scaling-stroke;
    transition:fill .12s;
  }
  path.state:hover{ fill:var(--map-hover); }
  path.state.correct{ fill:var(--ok-fill); stroke:var(--ok); }
  path.state.wrong{ fill:var(--bad-fill); stroke:var(--bad); }
  path.state.revealed{ fill:var(--brass); stroke:var(--brass-deep); }

  .zoom-ctrls{
    position:absolute;
    right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:5;
  }
  .zoom-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--panel-shadow);
  }
  .zoom-btn:hover{border-color:var(--brass);}

  .tooltip{
    position:absolute;
    pointer-events:none;
    background:var(--ink);
    color:var(--paper);
    font-family:"IBM Plex Mono",monospace;
    font-size:.68rem;
    padding:3px 7px;
    border-radius:5px;
    transform:translate(-50%,-130%);
    white-space:nowrap;
    z-index:6;
    opacity:0;
    transition:opacity .1s;
  }
  .tooltip.show{opacity:1;}

  .answer-panel{
    position:absolute;
    left:50%;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    width:min(420px,calc(100% - 28px));
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--panel-shadow);
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:5;
  }
  .answer-panel[hidden]{display:none;}
  .answer-panel .label{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .answer-row{
    display:flex;
    gap:8px;
  }
  .answer-row input{
    flex:1;
    font:inherit;
    font-family:"Work Sans",sans-serif;
    font-size:.95rem;
    padding:9px 11px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .ctrl-btn{
    font:inherit;
    font-weight:600;
    font-size:.85rem;
    padding:9px 15px;
    border-radius:9px;
    border:1px solid var(--brass);
    background:var(--brass);
    color:#fff8ee;
    cursor:pointer;
    white-space:nowrap;
  }
  .ctrl-btn.ghost{
    background:transparent;
    color:var(--brass-deep);
  }
  .ctrl-btn:disabled{opacity:.45;cursor:default;}
  .feedback{
    font-size:.85rem;
    font-weight:600;
    display:none;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .feedback.show{display:flex;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}
  .feedback .answer-reveal{
    font-weight:500;
    color:var(--ink-soft);
  }

  .side-info{
    position:absolute;
    top:12px;
    left:12px;
    max-width:min(260px,calc(100% - 24px));
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--panel-shadow);
    padding:11px 13px;
    font-size:.78rem;
    color:var(--ink-soft);
    z-index:5;
  }
  .side-info[hidden]{display:none;}
  .side-info h3{
    margin:0 0 6px;
    font-family:"Fraunces",serif;
    font-size:.95rem;
    color:var(--ink);
    font-weight:600;
  }
  .side-info ul{
    margin:6px 0 0;
    padding-left:18px;
  }
  .side-info li{margin-bottom:2px;}

  .end-card{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    z-index:8;
    padding:20px;
  }
  .end-card.show{display:flex;}
  .end-card .box{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--panel-shadow);
    padding:22px 24px;
    max-width:340px;
    text-align:center;
  }
  .end-card h2{
    font-family:"Fraunces",serif;
    font-size:1.3rem;
    margin:0 0 6px;
  }
  .end-card p{
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  circle.mark{
    fill:none;
    stroke-width:2.5;
    vector-effect:non-scaling-stroke;
    pointer-events:none;
  }
  circle.mark.correct{stroke:var(--ok);fill:var(--ok-fill);fill-opacity:.55;}
  circle.mark.revealed{stroke:var(--brass-deep);fill:var(--brass);fill-opacity:.45;}
  circle.mark.wrong{stroke:var(--bad);fill:var(--bad-fill);fill-opacity:.6;}
  text.mark-label{
    font-family:"Work Sans",sans-serif;
    font-weight:600;
    fill:var(--ink);
    text-anchor:middle;
    paint-order:stroke;
    stroke:var(--paper-raised);
    stroke-width:3px;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
    pointer-events:none;
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Atlas <em>Trenažér</em></h1>
      <span class="score" id="scoreLabel">skóre 0/0</span>
    </div>
    <nav class="modes" id="modeNav">
      <button data-mode="capitals" class="active">13 · Hlavní města</button>
      <button data-mode="africa">18 · Afrika</button>
      <button data-mode="america">19 · Amerika</button>
      <button data-mode="river">12 · Řeka USA</button>
      <button data-mode="population">Lidnatost</button>
      <button data-mode="smallest">Nejméně lidnaté</button>
      <button data-mode="density">Hustota</button>
    </nav>
    <div class="prompt-row">
      <div class="prompt" id="promptText">Načítám mapu…</div>
      <div class="progress" id="progressLabel"></div>
    </div>
    <div class="subprompt" id="subPrompt"></div>
    <div class="toggle-row">
      <button class="toggle on" id="hintToggle" role="switch" aria-checked="true" aria-label="Nápověda s názvy"></button>
      <span>Nápověda: názvy při najetí myší</span>
    </div>
  </header>

  <main class="stage">
    <svg class="map" id="map"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="zoom-ctrls">
      <button class="zoom-btn" id="zoomIn" aria-label="Přiblížit">+</button>
      <button class="zoom-btn" id="zoomOut" aria-label="Oddálit">−</button>
      <button class="zoom-btn" id="zoomReset" aria-label="Reset pohledu">⟲</button>
    </div>
    <div class="side-info" id="sideInfo" hidden></div>
    <div class="answer-panel" id="answerPanel" hidden>
      <div class="label" id="answerLabel">Klikni na správný stát na mapě</div>
      <div class="answer-row" id="answerRow" hidden>
        <input type="text" id="answerInput" placeholder="Hlavní město…" autocomplete="off" spellcheck="false">
        <button class="ctrl-btn" id="submitBtn">Ověřit</button>
      </div>
      <div class="answer-row" id="findRow" hidden style="justify-content:flex-end">
        <button class="ctrl-btn ghost" id="revealBtn">Nevím – ukázat</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="answer-row" id="nextRow" hidden style="justify-content:flex-end">
        <button class="ctrl-btn" id="nextBtn">Další →</button>
      </div>
    </div>
    <div class="end-card" id="endCard">
      <div class="box">
        <h2 id="endTitle">Hotovo!</h2>
        <p id="endText"></p>
        <button class="ctrl-btn" id="restartBtn">Zkusit znovu</button>
      </div>
    </div>
  </main>
</div>

/* ---------- boot ---------- */

function start(saved){
  score = (saved && saved.score) || 0;
  total = (saved && saved.total) || 0;
  updateScore();

  Promise.all([
    fetch("countries-110m.json").then(function(r){return r.json();}),
    fetch("states-10m.json").then(function(r){return r.json();})
  ]).then(function(res){
    var worldTopo = res[0], statesTopo = res[1];
    worldFeatures = topojson.feature(worldTopo, worldTopo.objects.countries).features;
    statesFeatures = topojson.feature(statesTopo, statesTopo.objects.states).features;
    buildMap();
    var m0 = "capitals";
    try{
      var q = new URLSearchParams(location.search).get("mode");
      if(q === "populous") q = "population";
      if(["capitals","africa","america","river","population","smallest","density"].indexOf(q) >= 0) m0 = q;
    }catch(e){}
    setMode(m0);
  }).catch(function(err){
    promptText.textContent = "Chyba při načítání mapy.";
    console.error(err);
  });
}

function persist(){
  try{
    localStorage.setItem("atlas-trenazer-score", JSON.stringify({score:score,total:total}));
    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot({score:score,total:total});
    }
  }catch(e){}
}

function updateScore(){
  scoreLabel.textContent = "skóre " + score + "/" + total;
}

/* ---------- map building ---------- */

function buildMap(){
  var vb = svg.node().getBoundingClientRect();
  width = vb.width || 960;
  height = vb.height || 520;
  svg.attr("viewBox","0 0 "+width+" "+height);

  projection = d3.geoNaturalEarth1();
  var sphere = {type:"Sphere"};
  var landOnly = {type:"FeatureCollection", features: worldFeatures.filter(function(f){return f.properties.name!=="Antarctica";})};
  projection.fitExtent([[14,14],[width-14,height-14]], landOnly);
  path = d3.geoPath(projection);

  landPaths = gWorld.selectAll("path.land")
    .data(worldFeatures.filter(function(f){return f.properties.name!=="Antarctica";}))
    .enter().append("path")
    .attr("class","land")
    .attr("d", path)
    .on("mousemove", onLandHover)
    .on("mouseleave", hideTooltip)
    .on("click", onLandClick);

  statesProjection = d3.geoAlbersUsa();
  statesProjection.fitExtent([[14,14],[width-14,height-14]], {type:"FeatureCollection", features: statesFeatures});
  statesPath = d3.geoPath(statesProjection);

  statePaths = gStates.selectAll("path.state")
    .data(statesFeatures)
    .enter().append("path")
    .attr("class","state")
    .attr("d", statesPath)
    .on("mousemove", onStateHover)
    .on("mouseleave", hideTooltip)
    .on("click", onStateClick);

  zoomBehavior = d3.zoom()
    .scaleExtent([1,60])
    .on("zoom", function(ev){
      gWorld.attr("transform", ev.transform);
      gStates.attr("transform", ev.transform);
      gMarks.attr("transform", ev.transform);
      scaleMarks(ev.transform.k);
    });
  svg.call(zoomBehavior);
  svg.on("click", onMapClick);

  document.getElementById("zoomIn").onclick = function(){ svg.transition().duration(200).call(zoomBehavior.scaleBy, 1.6); };
  document.getElementById("zoomOut").onclick = function(){ svg.transition().duration(200).call(zoomBehavior.scaleBy, 0.625); };
  document.getElementById("zoomReset").onclick = function(){ svg.transition().duration(250).call(zoomBehavior.transform, d3.zoomIdentity); };

  window.addEventListener("resize", debounce(function(){
    var box = svg.node().getBoundingClientRect();
    width = box.width; height = box.height;
    svg.attr("viewBox","0 0 "+width+" "+height);
  }, 200));
}

function debounce(fn, ms){
  var t;
  return function(){ clearTimeout(t); var a=arguments; t=setTimeout(function(){fn.apply(null,a);}, ms); };
}

function zoomToBounds(bboxPath, feature, extraPad){
  var b = bboxPath.bounds(feature);
  var pad = extraPad || 40;
  var dx = b[1][0]-b[0][0], dy = b[1][1]-b[0][1];
  var x = (b[0][0]+b[1][0])/2, y=(b[0][1]+b[1][1])/2;
  var scale = Math.max(1, Math.min(8, 0.9 / Math.max(dx/(width-pad), dy/(height-pad))));
  var translate = [width/2 - scale*x, height/2 - scale*y];
  svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(translate[0],translate[1]).scale(scale));
}

/* ---------- tooltip ---------- */

function onLandHover(ev, d){

function onStateHover(ev, d){

function showTooltip(ev, text){
  var box = svg.node().getBoundingClientRect();

  tooltip.style.top = (ev.clientY - box.top) + "px";
  tooltip.classList.add("show");
}

document.getElementById("modeNav").addEventListener("click", function(ev){

function setMode(m){
  mode = m;
  Array.prototype.forEach.call(document.querySelectorAll("#modeNav button"), function(b){
    b.classList.toggle("active", b.dataset.mode===m);
  });
  gStates.style("display","none");

  endCard.classList.remove("show");
  landPaths.classed("correct wrong revealed",false);
  statePaths.classed("correct wrong revealed",false);
  gMarks.selectAll("*").remove();
  smLocked = true;
  smActive = false;
  denActive = false;
  denLocked = true;
  popA = null;
  svg.interrupt().transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
  answerPanel.hidden = false;
  answerRow.hidden = true;
  findRow.hidden = true;
  nextRow.hidden = true;
  feedback.classList.remove("show","ok","bad");
  activeTextChecker = null;

  if(m==="capitals"){
    startCapitals();
  } else if(m==="africa"){
    startCountryFind("africa", AFRICA_POOL, AFRICA_NOT);
  } else if(m==="america"){
    startCountryFind("america", AMERICA_POOL, AMERICA_NOT);
  } else if(m==="river"){
    setupRiverNameStep();
  } else if(m==="population"){
    startPopulation();
  } else if(m==="smallest"){
    startSmallest();
  } else if(m==="density"){
    startDensity();
  }
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

/* ---------- generic find-on-the-map engine ---------- */

function startFind(queue, layer, opts){
  findQueue = queue;
  findIdx = 0;
  findFound = 0; findRevealed = 0;
  findLayer = layer;
  findOnEachFound = opts.onEachFound;
  findOnDone = opts.onDone;
  showFindTarget();
}

function showFindTarget(){
  findLocked = false;
  (findLayer==="world" ? landPaths : statePaths).classed("wrong",false);
  answerRow.hidden = true;
  nextRow.hidden = true;
  feedback.classList.remove("show","ok","bad");

  if(findIdx >= findQueue.length){
    findRow.hidden = true;
    var onDone = findOnDone;
    var f = findFound, r = findRevealed, n = findQueue.length;
    onDone && onDone(f, r, n);
    return;
  }
  findRow.hidden = false;
  answerLabel.textContent = "Klikni na správný stát na mapě";
  var t = findQueue[findIdx];
  progressLabel.textContent = (mode==="population" ? "Nejlidnatější · " : "")+(findIdx+1)+" / "+findQueue.length;
  promptText.innerHTML = "Klikni na: <span class='target'>"+t.label+"</span>";
  if(mode==="capitals" || mode==="population") subPrompt.textContent = "Pak napiš hlavní město.";
  else subPrompt.textContent = "Nevíš-li, nech si stát ukázat.";
}

function resolveFind(revealed){
  var t = findQueue[findIdx];
  if(!t) return;
  findLocked = true;
  findRow.hidden = true;
  var sel = (findLayer==="world" ? landPaths : statePaths).filter(function(d){ return d.properties.name===t.key; });
  sel.classed(revealed ? "revealed" : "correct", true);
  if(revealed) findRevealed++; else findFound++;
  var pathFn = (findLayer==="world") ? path : statesPath;
  var feature = sel.data()[0];
  if(feature) zoomToBounds(pathFn, feature, findLayer==="world" ? 120 : 60);
  var advance = function(){ findIdx++; showFindTarget(); };
  findOnEachFound && findOnEachFound(t, revealed, advance);
}

function onFindMatch(name){
  if(findLocked) return false;
  var t = findQueue[findIdx];
  if(!t || name !== t.key) return false;
  resolveFind(false);
  return true;
}

revealBtn.addEventListener("click", function(){
  if(denActive){
    if(!denLocked) resolveDen(true);
    return;
  }
  if(smActive){
    if(!smLocked) smResolve(true);
    return;
  }
  if(findLocked) return;
  resolveFind(true);
});

function showNextUI(advance){
  nextRow.hidden = false;
  nextBtn.textContent = "Další →";
  nextBtn.onclick = advance;
}

    return { key:c.country, label:CZ_NAMES[c.country], answers:c.answers, display:c.display };
  }), "Hlavní města hotova!", "všech # států ze cvičení 13");

function startPopulation(){
  startCapitalQuiz(POPULOUS, "", "", function(found, revealed, n){
    popA = { found:found, revealed:revealed, n:n };
    startSmallest();
  });

function startCapitalQuiz(entries, title, what, onAllDone){
  var queue = shuffle(entries.slice()).map(function(c){
    return { key:c.key, label:c.label, capital:c };
  });
  startFind(queue, "world", {
    onEachFound: function(t, revealed, advance){
      answerRow.hidden = false;
      answerLabel.textContent = "Hlavní město státu "+t.label+"?";
      answerInput.value = "";
      answerInput.placeholder = "Hlavní město…";
      answerInput.focus();
      activeTextChecker = function(){
        var val = normalize(answerInput.value);
        var ok = t.capital.answers.some(function(a){ return normalize(a)===val; });
        total++; if(ok) score++;
        updateScore(); persist();
        feedback.classList.add("show", ok?"ok":"bad");
        feedback.innerHTML = ok
          ? "Správně! ✓"
          : "Špatně — správně je <span class='answer-reveal'>"+t.capital.display+"</span>";
        answerRow.hidden = true;
        showNextUI(advance);
      };
    },
    onDone: function(found, revealed, n){
      if(onAllDone){ onAllDone(found, revealed, n); return; }
      showEnd(title, "Prošel/prošla jsi "+what.replace("#", n)+". Sám/sama jsi našel/našla "+found+", "+revealed+" ti Atlas ukázal.");
    }
  });
}

/* ---------- mode: find countries (Q18 / Q19) ---------- */

function startCountryFind(kind, pool, notList){
  var contName = kind==="africa" ? "Africe" : "Americe";
  var queue = shuffle(pool.slice()).map(function(name){
    return { key:name, label:CZ_NAMES[name]||name };
  });
  startFind(queue, "world", {
    onEachFound: function(t, revealed, advance){
      var isNot = notList.indexOf(t.key) >= 0;
      var fact = "<b>"+t.label+"</b> "+(isNot ? "NEleží v " : "leží v ")+contName+".";
      total++; if(!revealed) score++;
      updateScore(); persist();
      feedback.classList.add("show","ok");
      feedback.innerHTML = (revealed ? "Tady je: " : "Správně! ✓ ") + fact;
      showNextUI(advance);
    },
    onDone: function(found, revealed, n){
      var title = kind==="africa" ? "Afrika hotová!" : "Amerika hotová!";
      showEnd(title, "Prošel/prošla jsi všech "+n+" států. Sám/sama jsi našel/našla "+found+", "+revealed+" ti Atlas ukázal.");
    }
  });
}

/* ---------- mode: smallest territories (click on the place) ---------- */

function scaleMarks(k){
  gMarks.selectAll("circle").attr("r", function(){ return (+this.getAttribute("data-r")) / k; });
  gMarks.selectAll("text")
    .attr("font-size", 12 / k)
    .attr("y", function(){ return (+this.getAttribute("data-py")) - 18 / k; });
}

function drawMark(p, cls, r, label){
  var c = gMarks.append("circle")
    .attr("class","mark " + cls)
    .attr("cx", p[0]).attr("cy", p[1])
    .attr("data-r", r);
  if(label){
    gMarks.append("text")
      .attr("class","mark-label")
      .attr("x", p[0]).attr("data-py", p[1])
      .text(label);
  }
  scaleMarks(d3.zoomTransform(svg.node()).k);
  return c;
}

function zoomToPoint(p, k){
  svg.interrupt().transition().duration(600).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(width/2 - k*p[0], height/2 - k*p[1]).scale(k)
  );
}

function startSmallest(){

  landPaths.classed("correct wrong revealed", false);

function showSmallTarget(){
  smLocked = false;
  gMarks.selectAll("*").remove();
  nextRow.hidden = true;
  answerRow.hidden = true;

  if(smIdx >= smQueue.length){
    findRow.hidden = true;
    smLocked = true;
    var a = popA ? "Nejlidnatější: sám/sama jsi našel/našla "+popA.found+" z "+popA.n+", "+popA.revealed+" ti Atlas ukázal. " : "";
    showEnd(popA ? "Lidnatost hotova!" : "Nejméně lidnaté hotovy!", a + "Nejméně lidnaté: sám/sama jsi trefil/trefila "+smFound+" z "+smQueue.length+", "+smRevealed+" ti Atlas ukázal.");
    return;
  }
  var t = smQueue[smIdx];
  findRow.hidden = false;
  answerLabel.textContent = "Přibliž mapu a klikni na místo, kde stát leží";
  progressLabel.textContent = "Nejméně lidnaté · "+(smIdx+1)+" / "+smQueue.length;
  promptText.innerHTML = "Klikni na: <span class='target'>"+t.label+"</span>";
  subPrompt.textContent = "Teď 10 nejméně lidnatých států. Jsou moc malé na hranice v mapě: přibliž mapu a klikni do místa, kde leží. Nevíš-li, nech si ho ukázat.";
}

function smResolve(wasRevealed){
  var t = smQueue[smIdx];
  smLocked = true;
  findRow.hidden = true;
  if(wasRevealed) smRevealed++; else smFound++;
  total++; if(!wasRevealed) score++;
  updateScore(); persist();

  var p = projection([t.lon, t.lat]);
  gMarks.selectAll("*").remove();
  drawMark(p, wasRevealed ? "revealed" : "correct", 14, t.label);
  zoomToPoint(p, 12);

  var cap = t.capital
    ? "Hlavní město: <b>"+t.capital+"</b>"
    : "Hlavní město nemá <span class='answer-reveal'>(každý atol má vlastní správní centrum)</span>";
  feedback.classList.remove("bad");
  feedback.classList.add("show","ok");
  feedback.innerHTML = (wasRevealed ? "Tady je: <b>"+t.label+"</b>. " : "Správně! ✓ ") + cap;
  showNextUI(function(){ smIdx++; showSmallTarget(); });
}

function onMapClick(ev){
  if(denActive){ onDenClick(ev); return; }
  if(!smActive || smLocked) return;
  var t = smQueue[smIdx];
  if(!t) return;
  var pt = d3.pointer(ev, svg.node());
  var tr = d3.zoomTransform(svg.node());
  var mp = [(pt[0] - tr.x) / tr.k, (pt[1] - tr.y) / tr.k];

  function screenDist(o){
    var q = projection([o.lon, o.lat]);
    return Math.hypot(q[0] - mp[0], q[1] - mp[1]) * tr.k;
  }
  var dCur = screenDist(t);
  var nearest = SMALLEST.every(function(o){ return o === t || screenDist(o) >= dCur; });
  if(dCur <= HIT_RADIUS && nearest){
    smResolve(false);
    return;
  }

  var wrong = drawMark(mp, "wrong", 10, null);
  setTimeout(function(){ wrong.remove(); }, 600);

  var msg = "Vedle.";
  var ll = projection.invert(mp);
  if(ll){
    var km = Math.round(d3.geoDistance(ll, [t.lon, t.lat]) * 6371 / 10) * 10;
    msg = "Vedle — jsi zhruba " + km.toLocaleString("cs-CZ") + " km od cíle.";
  }
  feedback.classList.remove("ok");
  feedback.classList.add("show","bad");
  feedback.textContent = msg;
}

/* ---------- mode: population density (Hustota) ---------- */

function startDensity(){
  denActive = true;
  activeTextChecker = null;
  denParts = [
    { name:"Nízká hustota", items:DENSITY_LOW },
    { name:"Vysoká hustota", items:DENSITY_HIGH }
  ];
  denStats = [];
  denPartIdx = 0;
  startDenPart();
}

function startDenPart(){
  denQueue = shuffle(denParts[denPartIdx].items.slice());
  denIdx = 0; denFound = 0; denRevealed = 0;
  showDenTarget();
}

function showDenTarget(){
  denLocked = false;
  activeTextChecker = null;
  gMarks.selectAll("*").remove();
  landPaths.classed("correct wrong revealed", false);
  svg.interrupt().transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
  answerRow.hidden = true;
  nextRow.hidden = true;
  feedback.classList.remove("show","ok","bad");

  if(denIdx >= denQueue.length){
    findRow.hidden = true;
    denLocked = true;
    denStats.push({ name:denParts[denPartIdx].name, found:denFound, revealed:denRevealed, n:denQueue.length });
    if(denPartIdx + 1 < denParts.length){
      denPartIdx++;
      startDenPart();
      return;
    }
    var txt = denStats.map(function(s){
      return s.name+": sám/sama jsi našel/našla "+s.found+" z "+s.n+", "+s.revealed+" ti Atlas ukázal.";
    }).join(" ");
    showEnd("Hustota hotova!", txt);
    return;
  }
  var t = denQueue[denIdx];
  var partName = denParts[denPartIdx].name;
  findRow.hidden = false;
  answerLabel.textContent = t.kind === "point" ? "Přibliž mapu a klikni na místo, kde leží" : "Klikni na správný stát na mapě";
  progressLabel.textContent = partName+" · "+(denIdx+1)+" / "+denQueue.length;
  promptText.innerHTML = "Klikni na: <span class='target'>"+t.label+"</span>";
  var sub = t.kind === "point"
    ? "Malé území bez hranic v mapě: přibliž mapu a klikni do místa, kde leží."
    : "Najdi ho na mapě.";
  subPrompt.textContent = sub + (t.capital ? " Pak napiš hlavní město." : "") + " Nevíš-li, nech si ho ukázat.";
}

function resolveDen(wasRevealed){
  var t = denQueue[denIdx];
  denLocked = true;
  findRow.hidden = true;
  if(wasRevealed) denRevealed++; else denFound++;
  gMarks.selectAll("*").remove();

  if(t.kind === "poly"){
    var sel = landPaths.filter(function(d){ return d.properties.name === t.key; });
    sel.classed(wasRevealed ? "revealed" : "correct", true);
    var f = sel.data()[0];
    if(f) zoomToBounds(path, f, 120);
  } else {
    var p = projection([t.lon, t.lat]);
    drawMark(p, wasRevealed ? "revealed" : "correct", 14, t.label);
    zoomToPoint(p, 12);
  }
  var advance = function(){ denIdx++; showDenTarget(); };

  if(t.capital){
    answerRow.hidden = false;
    answerLabel.textContent = "Hlavní město: "+t.label+"?";
    answerInput.value = "";
    answerInput.placeholder = "Hlavní město…";
    answerInput.focus();
    activeTextChecker = function(){
      var val = normalize(answerInput.value);
      var ok = t.answers.some(function(a){ return normalize(a) === val; });
      total++; if(ok) score++;
      updateScore(); persist();
      feedback.classList.add("show", ok ? "ok" : "bad");
      feedback.innerHTML = ok
        ? "Správně! ✓"
        : "Špatně — správně je <span class='answer-reveal'>"+t.capital+"</span>";
      answerRow.hidden = true;
      activeTextChecker = null;
      showNextUI(advance);
    };
  } else {
    total++; if(!wasRevealed) score++;
    updateScore(); persist();
    feedback.classList.add("show","ok");
    feedback.innerHTML = (wasRevealed ? "Tady je: <b>"+t.label+"</b>. " : "Správně! ✓ ") +
      "<span class='answer-reveal'>(v tabulce k tomuto území hlavní město není)</span>";
    showNextUI(advance);
  }
}

function onDenClick(ev){
  if(denLocked) return;
  var t = denQueue[denIdx];
  if(!t) return;
  var pt = d3.pointer(ev, svg.node());
  var tr = d3.zoomTransform(svg.node());
  var mp = [(pt[0] - tr.x) / tr.k, (pt[1] - tr.y) / tr.k];
  var datum = ev.target && ev.target.__data__;
  var clickedName = datum && datum.properties ? datum.properties.name : null;

  if(t.kind === "poly"){
    if(clickedName === t.key){ resolveDen(false); return; }
  } else {
    var dist = function(o){
      var q = projection([o.lon, o.lat]);
      return Math.hypot(q[0] - mp[0], q[1] - mp[1]) * tr.k;
    };
    var dCur = dist(t);
    var nearest = DEN_POINTS.every(function(o){ return o === t || dist(o) >= dCur; });
    if(dCur <= HIT_RADIUS && nearest){ resolveDen(false); return; }
  }

  var wrong = drawMark(mp, "wrong", 10, null);
  setTimeout(function(){ wrong.remove(); }, 600);
  if(clickedName && t.kind === "poly"){
    flashWrongSel(landPaths.filter(function(x){ return x.properties.name === clickedName; }));
  }
  var target = null;
  if(t.kind === "point"){
    target = [t.lon, t.lat];
  } else {
    var tf = landPaths.filter(function(x){ return x.properties.name === t.key; }).data()[0];
    if(tf) target = d3.geoCentroid(tf);
  }
  var msg = "Vedle";
  if(clickedName) msg += " (klikl jsi na: " + (CZ_NAMES[clickedName] || clickedName) + ")";
  var ll = projection.invert(mp);
  if(ll && target){
    var km = Math.round(d3.geoDistance(ll, target) * 6371 / 10) * 10;
    msg += " — jsi zhruba " + km.toLocaleString("cs-CZ") + " km od cíle.";
  } else {
    msg += ".";
  }
  feedback.classList.remove("ok");
  feedback.classList.add("show","bad");
  feedback.textContent = msg;
}

/* ---------- shared click / feedback ---------- */

function onLandClick(ev, d){
  if(mode==="river" || smActive || denActive) return;
  if(findLocked) return;
  var name = d.properties.name;
  if(!onFindMatch(name)){
    flashWrongSel(landPaths.filter(function(x){ return x.properties.name===name; }));
  }
}

function onStateClick(ev, d){
  if(mode!=="river") return;
  if(findLocked) return;
  var name = d.properties.name;
  if(!onFindMatch(name)){
    flashWrongSel(statePaths.filter(function(x){ return x.properties.name===name; }));
  }
}

function flashWrongSel(sel){
  sel.classed("wrong",true);
  setTimeout(function(){ sel.classed("wrong",false); }, 450);
}

submitBtn.addEventListener("click", function(){ activeTextChecker && activeTextChecker(); });
answerInput.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ activeTextChecker && activeTextChecker(); } });

function showEnd(title, text){
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endText").textContent = text + " Celkové skóre: "+score+"/"+total+".";
  endCard.classList.add("show");
}
document.getElementById("restartBtn").addEventListener("click", function(){
  endCard.classList.remove("show");
  setMode(mode);
});

/* ---------- boot via hot API ---------- */

if(window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(start);
} else {
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem("atlas-trenazer-score")); }catch(e){}
  start(saved);
}
})();
</script>
